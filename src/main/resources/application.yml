server:
  port: ${PORT:8080}

spring:
  application:
    name: ev-charging-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:evdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true

# JWT, CORS and Platform Scheduling Config
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://grid-admin.netlify.app,https://ev-shop-management.netlify.app,https://ev-booking.netlify.app,https://*.netlify.app,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
  scheduling:
    default-full-charge-duration-minutes: 60
    default-turnaround-buffer-minutes: 10
    forecast-interval-minutes: 15
    forecast-horizon-hours: 6
    default-safety-margin-percent: 10.0

logging:
  level:
    com.evplatform: INFO
    org.springframework.security: WARN

